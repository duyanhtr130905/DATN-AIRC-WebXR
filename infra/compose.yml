name: datn-airc-foundation
services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airc_dev}
      POSTGRES_DB: ${POSTGRES_DB:-airc_foundation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in the ignored .env file}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - airc_foundation_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
volumes:
  airc_foundation_pg18:
