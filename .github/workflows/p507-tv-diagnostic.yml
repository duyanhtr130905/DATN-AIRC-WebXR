name: P507 TV bounds read-only diagnostic
on:
  pull_request:
    paths:
      - 'experiments/p507-webxr/diagnose_tv*'
      - 'experiments/p507-webxr/tv_diagnostic_math.py'
      - 'experiments/p507-webxr/test_tv_diagnostic.py'
      - 'experiments/p507-webxr/verify_diagnostic_exit.py'
      - 'docs/3d-production/P507-E0-TV-BOUNDS-DIAGNOSTIC.md'
      - '.github/workflows/p507-tv-diagnostic.yml'
      - 'docs/3d-production/P507-M2-INTEGRATION-19.md'
      - 'docs/ROADMAP.md'
      - 'docs/PROJECT_STATUS.md'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-version-diagnostic:
    # Legacy unprivileged compatibility check until separately approved activation.
    if: github.event_name == 'pull_request' || vars.P507_VAULT_CI_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CHROME_BIN: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Download original pinned artifact and verify six hashes
        run: |
          python experiments/p507-webxr/prepare_asset.py --download
          python experiments/p507-webxr/validate_asset.py --prepare
      - name: Install same Ubuntu Blender package family as original run
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -3
      - name: Read frozen blend and perform isolated DIAGNOSTIC_EXPORT_ONLY cases
        run: |
          mkdir -p .local/p507-tv-diagnostic
          blender --background --disable-autoexec --python-exit-code 1 --python experiments/p507-webxr/diagnose_tv_blender.py -- --artifact-dir .local/p507-e0-e1/artifact --output-dir .local/p507-tv-diagnostic/blender-original-version
      - run: npm ci --ignore-scripts --no-fund --prefix apps/web
      - name: Manual Three vertices vs Box3 (no E1 renderer)
        run: node experiments/p507-webxr/diagnose_tv_bounds.mjs
      - name: Independent decoder and controlled hypothesis comparisons
        run: |
          python -m unittest discover -s experiments/p507-webxr -p 'test_*.py' -v
          python experiments/p507-webxr/diagnose_tv_bounds.py --artifact-dir .local/p507-e0-e1/artifact --blender-dir .local/p507-tv-diagnostic/blender-original-version --three-report .local/p507-tv-diagnostic/three-tv-report.json --output .local/p507-tv-diagnostic/tv-bounds-diagnostic.json --require-original-version
      - name: Real CLI rejects injected Three mismatches after final conclusion
        run: python experiments/p507-webxr/verify_diagnostic_exit.py --artifact-dir .local/p507-e0-e1/artifact --blender-dir .local/p507-tv-diagnostic/blender-original-version --three-report .local/p507-tv-diagnostic/three-tv-report.json --output-dir .local/p507-tv-diagnostic/exit-regression
      - name: Confirm diagnostic never changed frozen lock or runtime gate
        run: |
          git diff --exit-code -- experiments/p507-g1-g2 experiments/p507-webxr/asset-lock.json apps/web/src/p507-e1/scene-contract.ts
          git diff --check
      - name: Upload numeric diagnostic evidence (not E0 acceptance)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p507-tv-bounds-read-only-diagnostic
          retention-days: 7
          if-no-files-found: warn
          path: |
            .local/p507-tv-diagnostic/**/*.json
            .local/p507-e0-e1/download-provenance.json
            .local/p507-e0-e1/e0-bundle-report.json

  vault-access-readiness:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report security gate without mislabeling skipped App tests
        env:
          ENABLED: ${{ vars.P507_VAULT_CI_ENABLED }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$REF" != refs/heads/main ]; then
            echo "CI_APP_RESTORE=BLOCKED_UNTRUSTED_CONTEXT; no App credentials made available" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ENABLED" != true ]; then
            echo "SECURITY_APPROVAL_REQUIRED: protected environment/App configuration missing; App E0/E1 NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "App job still requires protected environment admission and successful real restore; this status is not E0/E1 PASS" >> "$GITHUB_STEP_SUMMARY"
          fi

  vault-original-version-diagnostic:
    # Only main code can receive environment-only secrets. No arbitrary SHA input.
    if: >-
      github.repository == 'duyanhtr130905/DATN-AIRC-WebXR' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.P507_VAULT_CI_ENABLED == 'true'
    environment: p507-vault-ci
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P507_APP_CLIENT_ID: ${{ vars.P507_VAULT_APP_CLIENT_ID }}
      P507_APP_ID: ${{ vars.P507_VAULT_APP_ID }}
      P507_VAULT_INSTALLATION_ID: ${{ vars.P507_VAULT_INSTALLATION_ID }}
      CHROME_BIN: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify App JWT identity and minimal installation permissions
        run: node experiments/p507-webxr/app-identity.mjs
        env:
          P507_APP_PRIVATE_KEY: ${{ secrets.P507_VAULT_APP_PRIVATE_KEY }}
      - name: Mint vault-only short-lived read token
        id: vault-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0, Node24
        with:
          client-id: ${{ vars.P507_VAULT_APP_CLIENT_ID }}
          private-key: ${{ secrets.P507_VAULT_APP_PRIVATE_KEY }}
          owner: duyanhtr130905
          repositories: DATN-AIRC-WebXR-asset-vault
          permission-contents: read
          skip-token-revoke: false
      - name: Restore original only from pinned PRIVATE vault (no artifact fallback)
        run: |
          python experiments/p507-webxr/prepare_asset.py --restore-vault-ci
          python experiments/p507-webxr/validate_asset.py --prepare
        env:
          P507_VAULT_TOKEN: ${{ steps.vault-token.outputs.token }}
          P507_TOKEN_INSTALLATION_ID: ${{ steps.vault-token.outputs.installation-id }}
      - name: Install same Ubuntu Blender package family as original run
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -3
      - name: Read frozen blend and perform isolated DIAGNOSTIC_EXPORT_ONLY cases
        run: |
          mkdir -p .local/p507-tv-diagnostic
          blender --background --disable-autoexec --python-exit-code 1 --python experiments/p507-webxr/diagnose_tv_blender.py -- --artifact-dir .local/p507-e0-e1/artifact --output-dir .local/p507-tv-diagnostic/blender-original-version
      - run: npm ci --ignore-scripts --no-fund --prefix apps/web
      - name: Manual Three vertices vs Box3 (no E1 renderer)
        run: node experiments/p507-webxr/diagnose_tv_bounds.mjs
      - name: Independent decoder and controlled hypothesis comparisons
        run: |
          python -m unittest discover -s experiments/p507-webxr -p 'test_*.py' -v
          python experiments/p507-webxr/diagnose_tv_bounds.py --artifact-dir .local/p507-e0-e1/artifact --blender-dir .local/p507-tv-diagnostic/blender-original-version --three-report .local/p507-tv-diagnostic/three-tv-report.json --output .local/p507-tv-diagnostic/tv-bounds-diagnostic.json --require-original-version
      - name: Real CLI rejects injected Three mismatches after final conclusion
        run: python experiments/p507-webxr/verify_diagnostic_exit.py --artifact-dir .local/p507-e0-e1/artifact --blender-dir .local/p507-tv-diagnostic/blender-original-version --three-report .local/p507-tv-diagnostic/three-tv-report.json --output-dir .local/p507-tv-diagnostic/exit-regression
      - name: Confirm diagnostic never changed frozen lock or runtime gate
        run: |
          git diff --exit-code -- experiments/p507-g1-g2 experiments/p507-webxr/asset-lock.json apps/web/src/p507-e1/scene-contract.ts
          git diff --check
      - name: Upload numeric diagnostic evidence (not E0 acceptance)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p507-vault-tv-bounds-read-only-diagnostic
          retention-days: 7
          if-no-files-found: warn
          path: |
            .local/p507-tv-diagnostic/**/*.json
            .local/p507-e0-e1/ci-vault-report.json
            .local/p507-e0-e1/e0-bundle-report.json
